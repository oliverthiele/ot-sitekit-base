<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      lang="en" data-namespace-typo3-fluid="true">
<f:spaceless>
    <a href="{editUri}">
        <f:render partial="Header" arguments="{record: record}"/>
        <f:format.crop maxCharacters="2000"
                       respectWordBoundaries="true"
                       append="&nbsp;…"
                       respectHtml="true">{record.bodytext -> f:format.raw()}
        </f:format.crop>
    </a>
    <f:render partial="RecordDetails" arguments="{record: record}"/>
</f:spaceless>
</html>
