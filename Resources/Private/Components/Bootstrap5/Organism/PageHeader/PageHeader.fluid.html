<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      lang="en" data-namespace-typo3-fluid="true">

<f:argument name="menuMain" type="array" optional="{true}" default="{}"/>
<f:argument name="menuTop" type="array" optional="{true}" default="{}"/>
<f:argument name="menuLanguage" type="array" optional="{true}" default="{}"/>
<f:argument name="settings" type="array" optional="{true}" default="{}"/>
<f:argument name="homepage" type="int" optional="{true}" default="0"/>

<f:switch expression="{settings.sitekit.layout.pageHeader.variant}">
    <f:case value="TwoRowLogoTop">
        <skc:organism.pageHeader.twoRowLogoTop
            menuMain="{menuMain}"
            menuTop="{menuTop}"
            menuLanguage="{menuLanguage}"
            settings="{settings}"
            homepage="{homepage}"/>
    </f:case>
    <f:defaultCase>
        <skc:organism.pageHeader.twoRowMenuTop
            menuMain="{menuMain}"
            menuTop="{menuTop}"
            menuLanguage="{menuLanguage}"
            settings="{settings}"
            homepage="{homepage}"/>
    </f:defaultCase>
</f:switch>
</html>
