<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      lang="en" data-namespace-typo3-fluid="true">
<f:switch expression="{data.ot_layout}">
    <f:case value="100-media-100-text">
        <f:variable name="maxImageWidth" value="1296"/>
    </f:case>
    <f:defaultCase>
        <f:variable name="maxImageWidth" value="636"/>
    </f:defaultCase>
</f:switch>

<f:if condition="{data.crop_variant_xs} != 'org' && {data.crop_variant_xs} != ''">
    <f:variable name="cropVariant" value="{data.crop_variant_xs}"/>
    <f:variable name="ratioStart">
        <f:spaceless>
            <div
            <f:switch expression="{cropVariant}">
                <f:case value="1:1"> class="ratio ratio-1x1"</f:case>
                <f:case value="4:3"> class="ratio ratio-4x3"</f:case>
                <f:case value="16:9"> class="ratio ratio-16x9"</f:case>
                <f:case value="21:9"> class="ratio ratio-21x9"</f:case>
            </f:switch>
            ><div>
        </f:spaceless>
    </f:variable>
    <f:variable name="ratioEnd" value="</div></div>"/>
</f:if>

<f:if condition="{file.description}">
    <f:then>
        <figure class="figure">
            {ratioStart -> f:format.raw()}
            <f:image image="{file}" width="1296" maxWidth="{maxImageWidth}" cropVariant="{cropVariant}" class="figure-img img-fluid rounded"/>
            {ratioEnd -> f:format.raw()}
            <figcaption class="figure-caption">
                {file.description}
            </figcaption>
        </figure>
    </f:then>
    <f:else>
        {ratioStart -> f:format.raw()}
        <f:image image="{file}" width="1296" maxWidth="{maxImageWidth}" cropVariant="{cropVariant}"  class="img-fluid rounded"/>
        {ratioEnd -> f:format.raw()}
    </f:else>
</f:if>
</html>
