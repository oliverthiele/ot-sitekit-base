<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true" lang="en">
<f:spaceless>
    <span class="anchor" id="c{data.uid}"></span>
    <div id="ce-{data.uid}" class="card-group ot-content-element-margin-bottom">
        <f:for each="{children_300}" as="record">
            {record.renderedContent -> f:format.raw()}
        </f:for>
    </div>
</f:spaceless>
</html>
