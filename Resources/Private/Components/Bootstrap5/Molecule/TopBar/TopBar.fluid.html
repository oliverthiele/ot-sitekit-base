<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      lang="en" data-namespace-typo3-fluid="true">

<f:argument name="menuTop" type="array" optional="{true}" default="{}"/>
<f:argument name="menuLanguage" type="array" optional="{true}" default="{}"/>
<f:argument name="settings" type="array" optional="{true}" default="{}"/>
<f:argument name="homepage" type="int" optional="{true}" default="0"/>

<div id="topBar" class="sk-top-bar"
     aria-label="{f:translate(key: 'serviceNavigation', extensionName: 'OtSitekitbase')}">
    <div class="container g-0 d-flex">
        <skc:molecule.topMenu menuTop="{menuTop}" settings="{settings}" homepage="{homepage}"/>
        <skc:molecule.languageMenu menuLanguage="{menuLanguage}" settings="{settings}"/>
        <skc:molecule.colorModes settings="{settings}"/>
    </div>
</div>
</html>
