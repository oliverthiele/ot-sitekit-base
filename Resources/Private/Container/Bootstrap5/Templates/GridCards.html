<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true" lang="en">
<f:spaceless>
<f:switch expression="{data.ot_layout}">
    <f:case value="1">
        <f:variable name="columnClasses" value="row-cols-1 row-cols-md-2"/>
    </f:case>
    <f:case value="2">
        <f:variable name="columnClasses" value="row-cols-1 row-cols-md-2 row-cols-lg-3"/>
    </f:case>
    <f:case value="3">
        <f:variable name="columnClasses" value="row-cols-1 row-cols-md-2 row-cols-xl-4"/>
    </f:case>
    <f:defaultCase>
        <f:variable name="columnClasses" value="row-cols-1 row-cols-md-2 row-cols-lg-4"/>
    </f:defaultCase>
</f:switch>

<f:if condition="{settings.sitekit.layout.gutterSize}">
    <f:then>
        <f:variable name="gutterSize" value="{settings.sitekit.layout.gutterSize}"/>
    </f:then>
    <f:else>
        <f:variable name="gutterSize" value="3"/>
    </f:else>
</f:if>

<div id="ce-{data.uid}" class="row {columnClasses} g-{gutterSize} ot-content-element-margin-bottom">
    <span class="anchor" id="c{data.uid}"></span>
    <f:for each="{children_300}" as="record">
        <div class="col">
            {record.renderedContent -> f:format.raw()}
        </div>
    </f:for>
</div>
</f:spaceless>
</html>
