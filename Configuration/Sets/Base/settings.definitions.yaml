  sitekit.frameworks.frontend.directory:
    category: Sitekit.templates
    type: string
    default: 'Bootstrap5'


  sitekit.layout.pageHeader.variant:
    category: Sitekit.templates
    type: string
    default: 1
    enum:
      1: 'Row 1: Menu Top | Row 2: Logo, Menu Main, Search'
      2: 'Row 1: Logo, Menu Top | Row 2: Menu Main, Search'
