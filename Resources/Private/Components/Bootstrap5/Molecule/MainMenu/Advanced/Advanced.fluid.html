<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      lang="en" data-namespace-typo3-fluid="true">

<f:argument name="menuMain" type="array" optional="{true}" default="{}"/>
<f:argument name="settings" type="array" optional="{true}" default="{}"/>
<f:argument name="homepage" type="int" optional="{true}" default="0"/>
<f:argument name="navBrand" type="string" optional="{true}" default="Default"/>

<f:if condition="{menuMain}">
    <f:variable name="navbarExpand" value="navbar-expand-{settings.sitekit.menus.main.collapsing}"/>

    <f:switch expression="{settings.sitekit.menus.main.alignment}">
        <f:case value="start"><f:variable name="cssAlignment" value=" me-auto"/></f:case>
        <f:case value="center"><f:variable name="cssAlignment" value=" mx-auto"/></f:case>
        <f:case value="end"><f:variable name="cssAlignment" value=" ms-auto"/></f:case>
    </f:switch>

    <div id="main-navigation" class="bg-primary shadow-sm fixed-top">
        <div class="container">
            <nav class="navbar {navbarExpand} {settings.sitekit.menus.main.backgroundColor}"
                 aria-label="{f:translate(key: 'mainNavigation', extensionName: 'OtSitekitbase')}">
                <div class="container-fluid g-0">

                    <skc:atom.navbar.brand pageUid="{homepage}" settings="{settings}" navBrand="{navBrand}"/>
                    <skc:atom.navbar.toggler targetId="navbarMain" settings="{settings}"/>

                    <div class="collapse navbar-collapse" id="navbarMain">
                        <ul class="navbar-nav mb-2 mb-lg-0{cssAlignment}">
                            <f:for each="{menuMain}" as="item">
                                <f:render section="NavItem" arguments="{item: item}"/>
                            </f:for>
                        </ul>
                    </div>

                </div>
            </nav>
        </div>
    </div>
</f:if>

<f:section name="NavItem">
    <f:if condition="{item.hasSubpages}">
        <f:then>
            <li class="nav-item dropdown{f:if(condition: '{item.active}', then: ' active')}">
                <f:render section="NavLink" arguments="{item: item}"/>
                <button class="dropdown-toggle-btn"
                        type="button"
                        id="dropdown-toggle-btn-u{item.data.uid}"
                        aria-haspopup="true"
                        aria-expanded="false"
                        aria-controls="submenu-u{item.data.uid}"
                        aria-label="{f:translate(key: 'showSubNavigationForPage', extensionName: 'OtSitekitbase', default: 'Show subnavigation for page')} {item.title}"
                        data-bs-toggle="dropdown"
                        data-bs-display="static">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                         class="bi bi-chevron-down" viewBox="0 0 16 16" aria-hidden="true">
                        <path fill-rule="evenodd"
                              d="M1.646 4.646a.5.5 0 0 1 .708 0L8 10.293l5.646-5.647a.5.5 0 0 1 .708.708l-6 6a.5.5 0 0 1-.708 0l-6-6a.5.5 0 0 1 0-.708"/>
                    </svg>
                </button>
                <ul class="dropdown-menu"
                    id="submenu-u{item.data.uid}"
                    role="menu"
                    aria-label="{f:translate(key: 'subNavigationForPage', extensionName: 'OtSitekitbase', default: 'Subnavigation for page')} {item.title}"
                    aria-labelledby="dropdown-toggle-btn-u{item.data.uid}">
                    <f:for each="{item.children}" as="child">
                        <f:render section="DropdownItem" arguments="{child: child}"/>
                    </f:for>
                </ul>
            </li>
        </f:then>
        <f:else>
            <li class="nav-item{f:if(condition: '{item.active}', then: ' active')}">
                <f:render section="NavLink" arguments="{item: item}"/>
            </li>
        </f:else>
    </f:if>
</f:section>

<f:section name="NavLink">
    <f:variable name="targetBlankLabel" value=""/>
    <f:if condition="{item.target} == '_blank'">
        <f:variable name="targetBlankLabel"
                    value=" ({f:translate(key: 'openInNewTab', extensionName: 'OtSitekitbase')})"/>
    </f:if>
    <a href="{item.link}"
       {f:if(condition: '{item.current}', then: ' aria-current="page"')}
       {f:if(condition: '{item.target}', then: ' target="{item.target}"')}
       aria-label="{item.title}{targetBlankLabel}"
       class="nav-link me-1{f:if(condition: '{item.active}', then: ' active')}{f:if(condition: '{item.current}', then: ' current')}">
        {item.title}
    </a>
</f:section>

<f:section name="DropdownItem">
    <f:if condition="{child.spacer}">
        <f:then>
            <li role="separator" class="dropdown-divider" aria-hidden="true"></li>
        </f:then>
        <f:else>
            <f:variable name="targetBlankLabel" value=""/>
            <f:if condition="{child.target} == '_blank'">
                <f:variable name="targetBlankLabel"
                            value=" ({f:translate(key: 'openInNewTab', extensionName: 'OtSitekitbase', default: 'open in new tab')})"/>
            </f:if>
            <li role="none">
                <a href="{child.link}"
                   {f:if(condition: '{child.current}', then: ' aria-current="page"')}
                   {f:if(condition: '{child.target}', then: ' target="{child.target}"')}
                   aria-label="{child.title}{targetBlankLabel}"
                   role="menuitem"
                   class="dropdown-item{f:if(condition: '{child.active}', then: ' active')}{f:if(condition: '{child.current}', then: ' current')}">
                    {child.title}
                </a>
            </li>
        </f:else>
    </f:if>
</f:section>
</html>
