<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      lang="en" data-namespace-typo3-fluid="true">
<f:spaceless>
    <f:switch expression="{data.ot_layout}">
        <f:case value="secondary">
            <f:variable name="cssClasses" value=" bg-secondary" />
        </f:case>
        <f:case value="light">
            <f:variable name="cssClasses" value=" bg-light" />
        </f:case>
        <f:case value="dark">
            <f:variable name="cssClasses" value=" bg-dark" />
        </f:case>
        <f:defaultCase>
            <f:variable name="cssClasses" value=" bg-primary" />
        </f:defaultCase>
    </f:switch>
    <div class="ot-container-bg-color overflow-hidden ot-content-element-margin-bottom pt-{settings.sitekit.gutterSize}{cssClasses}">
        <f:for each="{children_100}" as="record">
            {record.renderedContent -> f:format.raw()}
        </f:for>
    </div>
</f:spaceless>
</html>
