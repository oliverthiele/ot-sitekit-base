<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:sk="http://typo3.org/ns/OliverThiele/OtSitekitbase/ViewHelpers"
      lang="en" data-namespace-typo3-fluid="true">

<f:comment><!-- Normalized video data array from VideoProcessor --></f:comment>
<f:argument name="video" type="array" optional="{false}"/>

<f:comment><!-- Display options --></f:comment>
<f:argument name="autoplay" type="boolean" optional="{true}" default="{false}"
            description="Activates IntersectionObserver-based autoplay via JS. Forces muted + playsinline."/>
<f:argument name="loop" type="boolean" optional="{true}" default="{false}"/>
<f:argument name="controls" type="boolean" optional="{true}" default="{true}"
            description="Show native browser controls. Ignored for decorative videos."/>
<f:argument name="decorative" type="boolean" optional="{true}" default="{false}"
            description="Marks the video as purely decorative (aria-hidden, no title, no structured data)."/>
<f:argument name="aspectRatio" type="string" optional="{true}" default="16x9"
            description="Bootstrap ratio class suffix: 1x1, 4x3, 16x9, 21x9"/>
<f:argument name="showCaption" type="boolean" optional="{true}" default="{false}"
            description="Wraps the video in figure/figcaption when title is available. Ignored for decorative videos."/>
<f:argument name="columns" type="integer" optional="{true}" default="12"
            description="Bootstrap columns the video occupies (1–12). Used to calculate responsive media queries: e.g. 6 = 50% width, collapses to full width below stackingBreakpoint."/>
<f:argument name="stackingBreakpoint" type="string" optional="{true}" default="md"
            description="Below this breakpoint, multi-column layouts collapse to full width. Only used when columns is an integer."/>
<f:argument name="class" type="string" optional="{true}" default=""/>
<f:argument name="customControls" type="boolean" optional="{true}" default="{false}"
            description="Show custom play/pause overlay instead of native browser controls. Always active for autoplay videos. Enables expand button when expandable=1 is also set."/>
<f:argument name="expandable" type="boolean" optional="{true}" default="{false}"
            description="Shows the expand button (opens best quality in a dialog). Only effective when customControls=1. Driven by data.image_zoom in content elements."/>

<f:spaceless>
    <f:comment><!-- Pre-compute display flags --></f:comment>
    <f:variable name="isError" value="{f:if(condition: '{video.state} == \'error\'', then: 1, else: 0)}"/>
    <f:variable name="isVideoMissing" value="{f:if(condition: '{video.state} == \'videoMissing\'', then: 1, else: 0)}"/>
    <f:variable name="needsMuted" value="{f:if(condition: '{autoplay} || {decorative}', then: 1, else: 0)}"/>
    <f:comment><!-- Custom controls: always active for autoplay (WCAG 2.2.2), opt-in for regular videos --></f:comment>
    <f:variable name="showCustomControls" value="{f:if(condition: '{customControls} || {autoplay}', then: 1, else: 0)}"/>
    <f:comment><!-- Native controls: only when not using custom controls, not decorative, not autoplay --></f:comment>
    <f:variable name="showNativeControls" value="{f:if(condition: '!{showCustomControls} && !{decorative}', then: 1, else: 0)}"/>
    <f:variable name="hasTranscript" value="{f:if(condition: video.transcripts, then: 1, else: 0)}"/>
    <f:variable name="transcriptId" value="sk-video-transcript-{video.uid}"/>
    <f:variable name="doRenderFigure" value="{f:if(condition: '{showCaption} && !{decorative} && {video.title}', then: 1, else: 0)}"/>

    <f:comment><!-- Poster URL pre-computed for the native poster attribute (non-autoplay only) --></f:comment>
    <f:variable name="nativePosterUrl" value=""/>
    <f:if condition="{video.poster}">
        <f:variable name="nativePosterUrl" value="{f:uri.image(image: video.poster)}"/>
    </f:if>

    <f:comment><!-- Outer container class --></f:comment>
    <f:variable name="containerClass">sk-video ratio ratio-{aspectRatio}<f:if condition="{class}"> {class}</f:if><f:if condition="{autoplay}"> sk-video-autoplay</f:if></f:variable>

    <f:if condition="{isError}">
        <f:then>
            <f:comment><!-- Error state: both video and poster are missing --></f:comment>
            <div class="{containerClass}"
                 <f:if condition="{decorative}">aria-hidden="true"</f:if>
                 <f:if condition="!{decorative}">role="img" aria-label="{f:translate(key: 'video.error.notAvailable', extensionName: 'OtSitekitbase')}"</f:if>
            >
                <f:render section="Placeholder" arguments="{_all}"/>
            </div>
        </f:then>
        <f:else>
            <f:comment><!-- Normal render: ok / posterMissing / videoMissing --></f:comment>
            <f:if condition="{doRenderFigure}">
                <figure class="figure w-100">
            </f:if>
            <div class="{containerClass}"
                 <f:if condition="!{decorative}">data-js="videoPlayer"</f:if>
                 <f:if condition="!{decorative} && {video.bestSrc}">data-best-src="{video.bestSrc}" data-best-src-type="{video.bestSrcType}"</f:if>
                 <f:if condition="{decorative}">aria-hidden="true"</f:if>
            >
                <f:comment><!-- Poster overlay: only for autoplay, fades out when video starts --></f:comment>
                <f:if condition="{autoplay} && {video.poster}">
                    <div class="sk-video-poster" aria-hidden="true">
                        <f:image image="{video.poster}" class="sk-video-poster-img" alt="" loading="eager"/>
                    </div>
                </f:if>

                <f:comment><!-- Loading spinner: visible during the preload → canplay phase --></f:comment>
                <f:if condition="{autoplay}">
                    <div class="sk-video-loader" aria-hidden="true">
                        <div class="sk-video-spinner"></div>
                    </div>
                </f:if>

                <f:comment><!-- Video element: omitted when folder has no video files --></f:comment>
                <f:if condition="!{isVideoMissing}">
                    <f:render section="VideoElement" arguments="{_all}"/>
                </f:if>

                <f:comment><!-- License notice: always shown when video.license is set, regardless of decorative --></f:comment>
                <f:if condition="{video.license}">
                    <div class="sk-video-license">
                        <button class="sk-video-license-btn"
                                type="button"
                                aria-label="{f:translate(key: 'video.license.label', extensionName: 'OtSitekitbase')}">
                            ©
                        </button>
                        <div class="sk-video-license-popup">
                            <f:if condition="{video.licenseUrl}">
                                <f:then><a href="{video.licenseUrl}" target="_blank" rel="noopener noreferrer">{video.license}</a></f:then>
                                <f:else>{video.license}</f:else>
                            </f:if>
                        </div>
                    </div>
                </f:if>

                <f:comment><!-- Custom controls: play/pause + expand. Only when showCustomControls is active. --></f:comment>
                <f:if condition="{showCustomControls} && !{decorative} && !{isVideoMissing}">
                    <div class="sk-video-controls" aria-label="{f:translate(key: 'video.controls.label', extensionName: 'OtSitekitbase')}">
                        <button class="sk-video-btn sk-video-btn-play" data-js="videoPlay"
                                type="button" aria-label="{f:translate(key: 'video.controls.playPause', extensionName: 'OtSitekitbase')}">
                            <span class="sk-video-icon sk-video-icon-play" aria-hidden="true">
                                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M8 5v14l11-7z"/></svg>
                            </span>
                            <span class="sk-video-icon sk-video-icon-pause" aria-hidden="true">
                                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                            </span>
                        </button>
                        <f:if condition="{autoplay}">
                            <button class="sk-video-btn sk-video-btn-mute" data-js="videoMute"
                                    type="button"
                                    aria-label="{f:translate(key: 'video.controls.unmute', extensionName: 'OtSitekitbase')}"
                                    data-label-mute="{f:translate(key: 'video.controls.mute', extensionName: 'OtSitekitbase')}"
                                    data-label-unmute="{f:translate(key: 'video.controls.unmute', extensionName: 'OtSitekitbase')}">
                                <span class="sk-video-icon sk-video-icon-volume-off" aria-hidden="true">
                                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73 4.27 3zM12 4 9.91 6.09 12 8.18V4z"/></svg>
                                </span>
                                <span class="sk-video-icon sk-video-icon-volume-on" aria-hidden="true">
                                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.26 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                                </span>
                            </button>
                        </f:if>
                        <f:if condition="{expandable} && {video.bestSrc}">
                            <button class="sk-video-btn sk-video-btn-expand" data-js="videoExpand"
                                    type="button"
                                    aria-label="{f:translate(key: 'video.controls.expand', extensionName: 'OtSitekitbase')}"
                                    data-label-close="{f:translate(key: 'video.controls.close', extensionName: 'OtSitekitbase')}">
                                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                            </button>
                        </f:if>
                    </div>
                </f:if>
            </div>

            <f:comment><!-- figcaption: visible title + hidden transcript (figure mode) --></f:comment>
            <f:if condition="{doRenderFigure}">
                <figcaption class="figure-caption">
                    {video.title}
                    <f:if condition="{hasTranscript}">
                        <div id="{transcriptId}" class="visually-hidden">
                            <f:for each="{video.transcripts}" as="transcriptText">
                                <p>{transcriptText}</p>
                            </f:for>
                        </div>
                    </f:if>
                </figcaption>
                </figure>
            </f:if>

            <f:comment><!-- Transcript without figure: standalone hidden div --></f:comment>
            <f:if condition="!{doRenderFigure} && {hasTranscript} && !{decorative}">
                <div id="{transcriptId}" class="visually-hidden">
                    <f:for each="{video.transcripts}" as="transcriptText">
                        <p>{transcriptText}</p>
                    </f:for>
                </div>
            </f:if>

            <f:comment><!-- Structured data: only for non-decorative videos with full meta.yaml --></f:comment>
            <f:if condition="{video.hasStructuredData} && !{decorative}">
                <f:render section="StructuredData" arguments="{_all}"/>
            </f:if>
        </f:else>
    </f:if>

</f:spaceless>


<f:section name="VideoElement">
    <video class="sk-video-element"
           preload="none"
           <f:if condition="{loop}">loop</f:if>
           <f:if condition="{needsMuted}">muted playsinline</f:if>
           <f:if condition="!{decorative} && {video.title}">aria-label="{video.title}"</f:if>
           <f:if condition="{decorative}">aria-hidden="true" tabindex="-1"</f:if>
           <f:if condition="{hasTranscript} && !{decorative}">aria-describedby="{transcriptId}"</f:if>
           <f:if condition="{nativePosterUrl} && !{autoplay}">poster="{nativePosterUrl}"</f:if>
           <f:if condition="{showNativeControls}">controls</f:if>
    >
        <sk:videoSources
            sources="{video.sources}"
            columns="{columns}"
            stackingBreakpoint="{stackingBreakpoint}"
        />

        <f:for each="{video.tracks}" as="track">
            <track kind="{track.kind}"
                   src="{track.url}"
                   srclang="{track.srclang}"
                   label="{track.label}"
                   <f:if condition="{track.default}">default</f:if>>
        </f:for>
    </video>
</f:section>


<f:section name="Placeholder">
    <f:comment><!-- Inline SVG: no external request, scales to any ratio container --></f:comment>
    <svg viewBox="0 0 16 9"
         xmlns="http://www.w3.org/2000/svg"
         class="sk-video-placeholder"
         aria-hidden="true">
        <rect width="16" height="9" fill="#f0f0f0"/>
        <f:comment><!-- Camera body --></f:comment>
        <rect x="4.2" y="2.9" width="5.4" height="3.8" rx="0.5" fill="#d0d0d0"/>
        <f:comment><!-- Lens outer ring --></f:comment>
        <circle cx="6.9" cy="4.8" r="1.2" fill="#bcbcbc"/>
        <f:comment><!-- Lens inner --></f:comment>
        <circle cx="6.9" cy="4.8" r="0.6" fill="#a8a8a8"/>
        <f:comment><!-- Viewfinder triangle --></f:comment>
        <polygon points="9.6,3.4 11.8,4.4 9.6,5.4" fill="#d0d0d0"/>
        <f:comment><!-- Error label — omitted for decorative videos --></f:comment>
        <f:if condition="!{decorative}">
            <text x="8" y="8.1"
                  text-anchor="middle"
                  font-size="0.72"
                  fill="#aaaaaa"
                  font-family="system-ui, -apple-system, sans-serif">
                <f:translate key="video.error.notAvailable" extensionName="OtSitekitbase"/>
            </text>
        </f:if>
    </svg>
</f:section>


<f:section name="StructuredData">
        <script type="application/ld+json">{video.structuredDataJson -> f:format.raw()}</script>
</f:section>

</html>
