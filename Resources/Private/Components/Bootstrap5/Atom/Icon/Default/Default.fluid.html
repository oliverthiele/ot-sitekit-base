<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      lang="en" data-namespace-typo3-fluid="true">

<f:argument name="identifier" type="string"/>
<f:argument name="returnAs" type="string" optional="{true}" default="inline"/>
<f:argument name="size" type="string" optional="{true}" default=""/>
<f:argument name="additionalClasses" type="string" optional="{true}" default=""/>
<f:argument name="ariaHidden" type="bool" optional="{true}" default="{true}"/>
<f:argument name="ariaLabel" type="string" optional="{true}" default=""/>
<f:argument name="title" type="string" optional="{true}" default=""/>

<f:if condition="{identifier}">
    <i:icon identifier="{identifier}"
            returnAs="{returnAs}"
            size="{size}"
            additionalClasses="{additionalClasses}"
            aria-hidden="{ariaHidden}"
            aria-label="{ariaLabel}"
            title="{title}"/>
</f:if>
</html>
