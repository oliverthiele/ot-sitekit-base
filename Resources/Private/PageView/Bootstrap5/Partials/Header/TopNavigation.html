<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      lang="en" data-namespace-typo3-fluid="true">
<head>
    <meta charset="utf-8">
    <title>Partial: MetaNavigation</title>
</head>
<body>
<f:section name="Main">
    <div id="top-navigation" aria-label="{f:translate(key: 'serviceNavigation', extensionName: 'OtSitekitbase')}">
        <div class="container g-0 d-flex">
            <f:render partial="Menus/Top/{settings.sitekit.menus.top.variant}/Index"
                      section="Main"
                      arguments="{menuTop : menuTop}"/>
            <f:render partial="Menus/Language/{settings.sitekit.menus.language.variant}/Index"
                      section="Main"
                      arguments="{languageMenu : languageMenu}"/>
            <f:render partial="Features/ColorModes/{settings.sitekit.features.colorModes.variant}/Index"
                      section="Main"
                      arguments="{_all}"/>
        </div>
    </div>
</f:section>
</body>
</html>
