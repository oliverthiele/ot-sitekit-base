<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:i="http://typo3.org/ns/OliverThiele/OtIcons/ViewHelpers"
      lang="en" data-namespace-typo3-fluid="true">
<head>
    <meta charset="utf-8">
    <title>Partial: Index</title>
</head>
<body>

<f:layout name="DefaultLayout"/>

<f:section name="Main">
    <f:if condition="{settings.sitekit.features.colorModes.enabled}">

        <f:variable name="class-dropdownToggle-label" value="d-none"/>
        <f:if condition="{settings.sitekit.features.colorModes.dropdownToggle.label.enabled}">
            <f:variable name="class-dropdownToggle-label"
                        value="d-none d-{settings.sitekit.menus.mainMenu.collapsing}-inline"/>
        </f:if>

        <ul class="nav __colorModes"
            aria-label="{f:translate(key: 'colorModes', extensionName: 'OtSitekitbase')}">
            <li class="nav-item px-2">
                <div class="dropdown __colorModes" role="group"
                     aria-label="{f:translate(key: 'colorModes', extensionName: 'OtSitekitbase')} {f:translate(key: 'choose', extensionName: 'OtSitekitbase')}">
                    <button class="btn btn-link nav-link dropdown-toggle"
                            type="button"
                            id="colorModesDropdown"
                            data-bs-toggle="dropdown"
                            aria-expanded="false"
                            aria-haspopup="true">
                        <span class="{class-dropdownToggle-label} dropdown-toggle-label" id="bd-theme-text">{f:translate(key: 'colorModes', extensionName: 'OtSitekitbase')}</span>
                        <span class="theme-icon-active dropdown-toggle-icon">
                              <i:icon identifier="sun" aria-hidden="true"/>
                        </span>
                    </button>
                    <ul class="dropdown-menu" aria-labelledby="colorModesDropdown">
                        <li>
                            <f:render section="Light" arguments="{_all}"/>
                        </li>
                        <li>
                            <f:render section="Dark" arguments="{_all}"/>
                        </li>
                    </ul>
                    <span id="activeTheme"
                          class="visually-hidden"
                          data-text-light="{f:translate(key: 'colorModes_current_light', extensionName: 'OtSitekitbase')}"
                          data-text-dark="{f:translate(key: 'colorModes_current_dark', extensionName: 'OtSitekitbase')}">
                          {f:translate(
                              key: 'colorModes_current_systemSettings',
                              extensionName: 'OtSitekitbase',
                              default: 'Current color mode: system settings'
                          )}
                    </span>
                </div>
            </li>
        </ul>
    </f:if>
</f:section>


<f:section name="Light">
    <button type="button"
            class="dropdown-item"
            data-bs-theme-value="light"
            aria-label="{f:translate(key: 'colorModes_light', extensionName: 'OtSitekitbase')} {f:translate(key: 'activate', extensionName: 'OtSitekitbase')}"
            title="{f:translate(key: 'colorModes_light', extensionName: 'OtSitekitbase')}"
            aria-pressed="false">
        <span class="dropdown-item-icon">
            <i:icon identifier="sun" aria-hidden="true"/>
        </span>
        <span class="d-none d-md-inline ps-2 dropdown-item-label">{f:translate(key: 'colorModes_light', extensionName: 'OtSitekitbase')}</span>
        <span class="ms-2 dropdown-item-label-is-active d-none">
            <i:icon identifier="check" aria-hidden="true"/>
        </span>
    </button>
</f:section>

<f:section name="Dark">
    <button type="button"
            class="dropdown-item"
            data-bs-theme-value="dark"
            aria-label="{f:translate(key: 'colorModes_dark', extensionName: 'OtSitekitbase')} {f:translate(key: 'activate', extensionName: 'OtSitekitbase')}"
            title="{f:translate(key: 'colorModes_dark', extensionName: 'OtSitekitbase')}"
            aria-pressed="false">
        <span class="dropdown-item-icon">
            <i:icon identifier="moon" aria-hidden="true"/>
        </span>
        <span class="d-none d-md-inline ps-2 dropdown-item-label">{f:translate(key: 'colorModes_dark', extensionName: 'OtSitekitbase')}</span>
        <span class="ms-2 dropdown-item-label-is-active d-none">
            <i:icon identifier="check" aria-hidden="true"/>
        </span>
    </button>
</f:section>
</body>
</html>
