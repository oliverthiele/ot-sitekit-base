<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:i="http://typo3.org/ns/OliverThiele/OtIcons/ViewHelpers"
      lang="en" data-namespace-typo3-fluid="true">

<f:argument name="settings" type="array" optional="{true}" default="{}"/>

<f:if condition="{settings.sitekit.features.colorModes.enabled}">
    <f:variable name="labelClass" value="d-none"/>
    <f:if condition="{settings.sitekit.features.colorModes.dropdownToggle.label.enabled}">
        <f:variable name="labelClass"
                    value="d-none d-{settings.sitekit.menus.main.collapsing}-inline"/>
    </f:if>

    <ul class="nav sk-color-modes"
        aria-label="{f:translate(key: 'colorModes', extensionName: 'OtSitekitbase')}">
        <li class="nav-item px-2">
            <div class="dropdown sk-color-modes-dropdown" role="group"
                 aria-label="{f:translate(key: 'colorModes', extensionName: 'OtSitekitbase')} {f:translate(key: 'choose', extensionName: 'OtSitekitbase')}">
                <button class="btn btn-link nav-link dropdown-toggle"
                        type="button"
                        id="colorModesDropdown"
                        data-js="colorModeToggle"
                        data-bs-toggle="dropdown"
                        aria-expanded="false"
                        aria-haspopup="true">
                    <span class="{labelClass} dropdown-toggle-label" data-js="colorModeLabel">
                        {f:translate(key: 'colorModes', extensionName: 'OtSitekitbase')}
                    </span>
                    <span class="dropdown-toggle-icon" data-js="colorModeActiveIcon">
                        <i:icon identifier="sun" aria-hidden="true"/>
                    </span>
                </button>
                <ul class="dropdown-menu" aria-labelledby="colorModesDropdown">
                    <li>
                        <button type="button"
                                class="dropdown-item"
                                data-js="colorModeOption"
                                data-bs-theme-value="light"
                                aria-label="{f:translate(key: 'colorModes_light', extensionName: 'OtSitekitbase')} {f:translate(key: 'activate', extensionName: 'OtSitekitbase')}"
                                title="{f:translate(key: 'colorModes_light', extensionName: 'OtSitekitbase')}"
                                aria-pressed="false">
                            <span class="dropdown-item-icon" data-js="colorModeOptionIcon"><i:icon identifier="sun" aria-hidden="true"/></span>
                            <span class="d-none d-md-inline ps-2 dropdown-item-label">
                                {f:translate(key: 'colorModes_light', extensionName: 'OtSitekitbase')}
                            </span>
                            <span class="ms-2 d-none" data-js="colorModeActiveIndicator">
                                <i:icon identifier="check" aria-hidden="true"/>
                            </span>
                        </button>
                    </li>
                    <li>
                        <button type="button"
                                class="dropdown-item"
                                data-js="colorModeOption"
                                data-bs-theme-value="dark"
                                aria-label="{f:translate(key: 'colorModes_dark', extensionName: 'OtSitekitbase')} {f:translate(key: 'activate', extensionName: 'OtSitekitbase')}"
                                title="{f:translate(key: 'colorModes_dark', extensionName: 'OtSitekitbase')}"
                                aria-pressed="false">
                            <span class="dropdown-item-icon" data-js="colorModeOptionIcon"><i:icon identifier="moon" aria-hidden="true"/></span>
                            <span class="d-none d-md-inline ps-2 dropdown-item-label">
                                {f:translate(key: 'colorModes_dark', extensionName: 'OtSitekitbase')}
                            </span>
                            <span class="ms-2 d-none" data-js="colorModeActiveIndicator">
                                <i:icon identifier="check" aria-hidden="true"/>
                            </span>
                        </button>
                    </li>
                </ul>
                <span id="activeTheme"
                      class="visually-hidden"
                      data-js="colorModeStatus"
                      data-text-light="{f:translate(key: 'colorModes_current_light', extensionName: 'OtSitekitbase')}"
                      data-text-dark="{f:translate(key: 'colorModes_current_dark', extensionName: 'OtSitekitbase')}">
                    {f:translate(key: 'colorModes_current_systemSettings', extensionName: 'OtSitekitbase', default: 'Current color mode: system settings')}
                </span>
            </div>
        </li>
    </ul>
</f:if>
</html>
