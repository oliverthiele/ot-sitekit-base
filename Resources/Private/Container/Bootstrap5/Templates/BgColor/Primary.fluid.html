<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">
<f:spaceless>
    <div class="sk-container-bgcolor sk-container-bgcolor-primary bg-primary overflow-hidden ot-content-element-margin-bottom"
         data-bs-theme="primary">
        <span class="anchor" id="c{data.uid}"></span>
        <f:for each="{children_100}" as="record">
            {record.renderedContent -> f:format.raw()}
        </f:for>
    </div>
</f:spaceless>
</html>
