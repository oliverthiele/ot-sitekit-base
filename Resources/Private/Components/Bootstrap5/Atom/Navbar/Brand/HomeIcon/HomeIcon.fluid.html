<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      lang="en" data-namespace-typo3-fluid="true">

<f:argument name="pageUid" type="int" optional="{false}" default=""/>
<f:argument name="settings" type="array" optional="{true}" default="{}"/>
<f:argument name="class" type="string" optional="{true}" default=""/>

<f:if condition="{class}">
    <f:variable name="additionalClasses" value=" {class}"/>
</f:if>

<f:link.page class="navbar-brand{additionalClasses}"
             pageUid="{pageUid}"
             title="{f:translate(key: 'homeLink', extensionName: 'OtSitekitbase', default: 'Home')}"
             aria-label="{f:translate(key: 'homeLink', extensionName: 'OtSitekitbase', default: 'Home')}">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
         class="bi bi-house-fill" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M8.707 1.5a1 1 0 0 0-1.414 0L.646 8.146a.5.5 0 0 0 .708.708L8 2.207l6.646 6.647a.5.5 0 0 0 .708-.708L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293z"/>
        <path d="m8 3.293 6 6V13.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 13.5V9.293z"/>
    </svg>
</f:link.page>
</html>
