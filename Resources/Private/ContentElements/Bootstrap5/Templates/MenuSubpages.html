<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:i="http://typo3.org/ns/OliverThiele/OtIcons/ViewHelpers"
      data-namespace-typo3-fluid="true">
<f:layout name="Default" />
<f:section name="Main">
    <f:if condition="{menu}">
        <div class="row {settings.sitekit.contentElements.menuSubpages.rowCols} g-4">
            <f:for each="{menu}" as="page">
                <div class="col">
                    <div class="card h-100">
                        <f:variable name="menuImage" value="{page.files.0}" />
                        <f:if condition="{menuImage}">
                            <div class="ratio ratio-16x9">
                                <f:image image="{menuImage}" class="card-img-top" maxWidth="750" cropVariant="16:9"/>
                            </div>
                        </f:if>

                        <div class="card-body">
                            <!-- todo parent header -->
                            <h2 class="h5 card-title">{page.title}</h2>
                            <p class="card-text">{page.data.abstract}</p>

                            <a href="{page.link}"{f:if(condition: page.target, then: ' target="{page.target}"')}{f:if(condition: page.current, then: ' aria-current="page"')} title="{page.title}">
                                Zur Seite <i:icon identifier="caret-right" aria-hidden="true"/>
                            </a>
                        </div>
                    </div>
                </div>
            </f:for>
        </div>
    </f:if>
</f:section>
</html>
