<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      lang="en" data-namespace-typo3-fluid="true">
<f:if condition="{file.description}">
    <f:then>
        <figure class="figure">
            <f:image image="{file}" maxWidth="1400" class="figure-img img-fluid rounded"/>
            <figcaption class="figure-caption">
                {file.description}
            </figcaption>
        </figure>
    </f:then>
    <f:else>
        <f:image image="{file}" maxWidth="1400" class="img-fluid"/>
    </f:else>
</f:if>
</html>
