<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      lang="en" data-namespace-typo3-fluid="true">
<f:spaceless>
    <a href="{editUri}">
        <div class="card" style="width: 300px;">
            <f:if condition="{assets}">
                <f:for each="{assets}" as="image">
                    <f:media file="{image}" width="300" class="card-img-top" alt="{image.alternative}"/>
                </f:for>
            </f:if>
            <div class="card-body">
                <div class="card-title">
                    <f:render partial="Header" arguments="{record: record}" />
                </div>
                <f:format.crop maxCharacters="2000" respectWordBoundaries="true" append="&nbsp;…" respectHtml="true">{record.bodytext -> f:format.raw()}</f:format.crop>
            </div>
        </div>
    </a>
    <f:render partial="RecordDetails" arguments="{record: record}" />
</f:spaceless>
</html>
