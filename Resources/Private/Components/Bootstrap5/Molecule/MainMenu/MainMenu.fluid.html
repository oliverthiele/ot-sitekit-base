<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      lang="en" data-namespace-typo3-fluid="true">

<f:argument name="menuMain" type="array" optional="{true}" default="{}"/>
<f:argument name="settings" type="array" optional="{true}" default="{}"/>
<f:argument name="homepage" type="int" optional="{true}" default="0"/>
<f:argument name="navBrand" type="string" optional="{true}" default="Default"/>

<f:switch expression="{settings.sitekit.menus.main.variant}">
    <f:case value="Advanced">
        <skc:molecule.mainMenu.advanced menuMain="{menuMain}" settings="{settings}" homepage="{homepage}" navBrand="{navBrand}"/>
    </f:case>
    <f:defaultCase>
        <skc:molecule.mainMenu.default menuMain="{menuMain}" settings="{settings}" homepage="{homepage}" navBrand="{navBrand}"/>
    </f:defaultCase>
</f:switch>
</html>
