<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      lang="en" data-namespace-typo3-fluid="true">

<f:argument name="menuMain" type="array" optional="{true}" default="{}"/>
<f:argument name="settings" type="array" optional="{true}" default="{}"/>
<f:argument name="homepage" type="int" optional="{true}" default="0"/>
<f:argument name="navBrand" type="string" optional="{true}" default="Default"/>

<f:variable name="navbarExpand" value="navbar-expand-{settings.sitekit.menus.main.collapsing}"/>

<f:switch expression="{settings.sitekit.menus.main.alignment}">
    <f:case value="start"><f:variable name="cssAlignment" value=" me-auto"/></f:case>
    <f:case value="center"><f:variable name="cssAlignment" value=" mx-auto"/></f:case>
    <f:case value="end"><f:variable name="cssAlignment" value=" ms-auto"/></f:case>
</f:switch>

<nav class="navbar {navbarExpand} bg-primary {settings.sitekit.menus.main.backgroundColor} shadow-sm fixed-top"
     aria-label="{f:translate(key: 'mainNavigation', extensionName: 'OtSitekitbase')}">
    <div class="container">

        <skc:atom.navbar.brand pageUid="{homepage}" settings="{settings}" navBrand="{navBrand}"/>
        <skc:atom.navbar.toggler targetId="navbarMain" settings="{settings}"/>

        <div class="collapse navbar-collapse" id="navbarMain">
            <ul class="navbar-nav mb-2 mb-lg-0{cssAlignment}">
                <f:for each="{menuMain}" as="item">
                    <f:render section="NavItem" arguments="{item: item}"/>
                </f:for>
            </ul>
        </div>

    </div>
</nav>

<f:section name="NavItem">
    <f:if condition="{item.hasSubpages}">
        <f:then>
            <li class="nav-item dropdown{f:if(condition: '{item.active}', then: ' active')}">
                <a class="nav-link dropdown-toggle"
                   href="#"
                   role="button"
                   data-bs-toggle="dropdown"
                   aria-expanded="false"
                   aria-label="{item.title}">
                    {item.title}
                </a>
                <ul class="dropdown-menu">
                    <f:for each="{item.children}" as="child">
                        <f:render section="DropdownItem" arguments="{child: child}"/>
                    </f:for>
                </ul>
            </li>
        </f:then>
        <f:else>
            <li class="nav-item{f:if(condition: '{item.active}', then: ' active')}">
                <a href="{item.link}"
                   {f:if(condition: '{item.current}', then: ' aria-current="page"')}
                   {f:if(condition: '{item.target}', then: ' target="{item.target}"')}
                   class="nav-link{f:if(condition: '{item.active}', then: ' active')}{f:if(condition: '{item.current}', then: ' current')}">
                    {item.title}
                </a>
            </li>
        </f:else>
    </f:if>
</f:section>

<f:section name="DropdownItem">
    <f:if condition="{child.spacer}">
        <f:then>
            <li><hr class="dropdown-divider"/></li>
        </f:then>
        <f:else>
            <li>
                <a href="{child.link}"
                   {f:if(condition: '{child.current}', then: ' aria-current="page"')}
                   {f:if(condition: '{child.target}', then: ' target="{child.target}"')}
                   class="dropdown-item{f:if(condition: '{child.active}', then: ' active')}{f:if(condition: '{child.current}', then: ' current')}">
                    {child.title}
                </a>
            </li>
        </f:else>
    </f:if>
</f:section>
</html>
