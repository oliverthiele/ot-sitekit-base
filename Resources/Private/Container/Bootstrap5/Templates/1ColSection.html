<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      lang="en" data-namespace-typo3-fluid="true">
<f:comment> <!-- <![CDATA[
    todo Add fields to TCA
]]>	--> </f:comment>
<f:variable name="cssClasses">
    <f:switch expression="{data.layout}">
        <f:case value="1">bg-primary section-primary</f:case>
        <f:case value="2">bg-secondary section-secondary</f:case>
        <f:case value="3">bg-dark section-dark</f:case>
        <f:defaultCase></f:defaultCase>
    </f:switch>
    <f:switch expression="{data.space_before_class}">
        <f:case value="extra-small">pt-1</f:case>
        <f:case value="small">pt-2</f:case>
        <f:case value="medium">pt-3</f:case>
        <f:case value="large">pt-4</f:case>
        <f:case value="extra-large">pt-5</f:case>
        <f:defaultCase>pt-0</f:defaultCase>
    </f:switch>
    <f:switch expression="{data.space_after_class}">
        <f:case value="extra-small">pb-1</f:case>
        <f:case value="small">pb-2</f:case>
        <f:case value="medium">pb-3</f:case>
        <f:case value="large">pb-4</f:case>
        <f:case value="extra-large">pb-5</f:case>
        <f:defaultCase>pb-0</f:defaultCase>
    </f:switch>
</f:variable>

<section id="ce-{data.uid}" class="{cssClasses}">
    <span class="anchor" id="c{data.uid}"></span>
    <f:for each="{children_100}" as="record">
        {record.renderedContent -> f:format.raw()}
    </f:for>
</section>
</html>
