<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      lang="en" data-namespace-typo3-fluid="true">
<head>
    <meta charset="utf-8">
    <title>Partial: MetaNavigation</title>
</head>
<body>
<f:section name="Main">
    <div id="top-navigation" aria-label="{f:translate(key: 'serviceNavigation', extensionName: 'ot_sitekitbase')}">
        <div class="container g-0 d-flex">
            <f:render partial="Page/Navigation/TopMenu/{settings.sitekit.components.page.topMenu}/Index"
                      section="Main"
                      arguments="{topMenu : topMenu, settings : settings}"/>
            <f:render partial="Page/Navigation/LanguageMenu/{settings.sitekit.components.page.languageMenu}/Index"
                      section="Main"
                      arguments="{languageMenu : languageMenu, settings : settings}"/>
            <f:render partial="Page/Features/ColorMode/{settings.sitekit.components.page.colorMode}/Index"
                      section="Main"
                      arguments="{_all}"/>
        </div>
    </div>
</f:section>
</body>
</html>
