<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      lang="en" data-namespace-typo3-fluid="true">
<head>
    <meta charset="utf-8">
    <title>Partial: Index</title>
</head>
<body>

<f:layout name="DefaultLayout" />

<f:section name="Main">
    <f:if condition="topMenu">
        <ul class="nav ms-auto __topMenu" aria-label="{f:translate(key: 'topMenu', extensionName: 'ot_sitekitbase')}">
            <f:for each="{topMenu}" as="item">
                <f:variable name="targetBlankLabel" value=""/>
                <f:if condition="{item.target} == '_blank'">
                    <f:variable name="targetBlankLabel"
                                value=" ({f:translate(key: 'openInNewTab', extensionName: 'OtSitekitbase', default: 'open in new tab')})"/>
                </f:if>

                <li class="nav-item{f:if(condition: '{item.current}', then: ' current')}{f:if(condition: '{item.active}', then: ' active')}">
                    <a href="{item.link}"
                       {f:if(condition: '{item.current}', then: ' aria-current="page"')}
                       {f:if(condition: '{item.target}', then: ' target="{item.target}"')}
                       class="nav-link{f:if(condition: 'item.active', then: ' active')}"
                       aria-label="{item.title}{targetBlankLabel}"
                       role="menuitem"
                       title="{item.title}">{item.title}</a>
                </li>
            </f:for>
        </ul>
    </f:if>
</f:section>

</body>
</html>
