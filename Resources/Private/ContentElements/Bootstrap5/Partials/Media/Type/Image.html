<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      lang="en" data-namespace-typo3-fluid="true">
<f:spaceless>
<f:comment> <!-- <![CDATA[
    The default is an image with rounded corners. A different class name can be specified in the content element.
    Todo: Add logic for lazy loading.
    Todo: Add logic for rounded corners.
]]>	--> </f:comment>
<f:if condition="{class}">
    <f:then>
        <f:variable name="class" value="{class}"/>
    </f:then>
    <f:else>
        <f:variable name="class" value="img-fluid rounded"/>
    </f:else>
</f:if>

<skc:atom.image image="{file}" class="{class}"
                numColumns="{numColumns}"
                gridColumns="{gridColumns}"
                maxWidth="{maxWidth}"
                data="{data}"
                loading="lazy"/>
</f:spaceless>
</html>
